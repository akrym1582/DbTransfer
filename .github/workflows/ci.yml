name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dbtransfer
          POSTGRES_USER: dbtransfer
          POSTGRES_PASSWORD: dbtransfer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbtransfer -d dbtransfer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBTRANSFER_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=dbtransfer;Username=dbtransfer;Password=dbtransfer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DbTransfer.slnx

      - name: Verify formatting
        run: dotnet format DbTransfer.slnx --verify-no-changes --no-restore

      - name: Run unit and PostgreSQL integration tests
        run: dotnet test DbTransfer.slnx --configuration Release --no-restore
